<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Лонжерон</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лонжерон">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/extra.css">
</head>
<body>

<div class="login-page">
  <form class="login-box" id="loginForm">
    <img src="/logo.png" alt="Лонжерон" class="login-logo">
    <p class="sub">CRM малярного цеха</p>

    <div class="login-error hidden" id="loginError"></div>

    <div class="field">
      <label for="login">Логин</label>
      <input type="text" id="login" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>

    <div class="field">
      <label for="password">Пароль</label>
      <div class="password-wrap">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Показать пароль" title="Показать пароль">
          <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.6 12S5.2 5.6 12 5.6 22.4 12 22.4 12 18.8 18.4 12 18.4 1.6 12 1.6 12z"/>
            <circle cx="12" cy="12" r="3.2"/>
          </svg>
          <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.6 12S5.2 5.6 12 5.6 22.4 12 22.4 12 18.8 18.4 12 18.4 1.6 12 1.6 12z"/>
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M3 3l18 18"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Войти</button>

    <p class="help-line">Логин выдаёт администратор цеха.</p>
  </form>
</div>

<script>
(() => {
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const submitBtn = document.getElementById('submitBtn');

  // Показать/скрыть введённый пароль
  const passwordInput = document.getElementById('password');
  const toggle = document.querySelector('[data-toggle-password]');

  if (toggle && passwordInput) {
    toggle.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      toggle.classList.toggle('is-on', show);
      toggle.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
      toggle.title = show ? 'Скрыть пароль' : 'Показать пароль';
      passwordInput.focus();
    });
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove('hidden');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Входим…';

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('login').value.trim(),
          password: document.getElementById('password').value
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        showError(data.error || 'Не удалось войти');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
        return;
      }

      location.href = '/';
    } catch (error) {
      showError('Сервер не отвечает. Проверьте, что он запущен.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Войти';
    }
  });
})();
</script>

</body>
</html>
