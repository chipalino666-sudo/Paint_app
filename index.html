<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Заказ-наряд</title><style>body{font-family:Arial,sans-serif;background:#f4f4f9;margin:0;padding:20px;height:100vh;box-sizing:border-box;overflow:hidden}.container{display:flex;gap:20px;height:100%}.panel{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:50%;display:flex;flex-direction:column;overflow-y:auto;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,20px)}h2{margin-top:0;font-size:20px;border-bottom:2px solid #ccc;padding-bottom:5px}input[type=text],input[type=number]{width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;font-size:16px}.clear-toggle{display:flex;align-items:center;margin-bottom:10px;font-size:14px;cursor:pointer;color:#0056b3;font-weight:bold;background:#eef;padding:8px 12px;border-radius:6px;border:1px solid #ccc}.clear-toggle input{margin-right:10px;width:20px;height:20px}.manual-add{background:#f8f9fa;border:1px solid #ddd;padding:10px;border-radius:6px;margin-bottom:15px}.manual-add h4{margin:0 0 10px;font-size:15px;color:#555}.manual-inputs{display:flex;gap:5px;margin-bottom:5px}.manual-inputs input[type=text]{margin-bottom:0;font-size:14px;padding:6px}.manual-btns{display:flex;gap:5px}.manual-btns button{flex:1;padding:8px;font-size:13px}ul{list-style:none;padding:0;margin:0;max-height:350px;overflow-y:auto;border:1px solid #ddd}li{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-size:15px}li:hover{background:#eef}.code{color:#666;font-size:13px;font-weight:bold}.btn-group{display:flex;gap:5px}button{cursor:pointer;border:none;border-radius:4px;color:#fff;font-weight:bold;font-size:12px}.btn-left{background:#007bff;padding:6px 10px}.btn-right{background:#28a745;padding:6px 10px}.actions{display:flex;gap:10px;margin-top:20px}.btn-pdf{background:#dc3545;flex:2;padding:15px;font-size:18px;border-radius:6px}.btn-clear{background:#6c757d;flex:1;padding:15px;font-size:16px;border-radius:6px}.hint{text-align:center;color:#666;font-size:14px;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px;table-layout:fixed}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;overflow:hidden;text-overflow:ellipsis}th{background:#f8f9fa;font-size:14px}.print-col h3{font-size:20px;margin:10px 0}.btn-del{background:red;padding:2px 5px;margin-left:5px}#table-paint th:nth-child(1),#table-materials th:nth-child(1){width:90px}#table-paint th:nth-child(2),#table-materials th:nth-child(2){width:auto}#table-paint th:nth-child(3),#table-materials th:nth-child(3){width:70px}#table-paint th:nth-child(4),#table-materials th:nth-child(4){width:40px}.print-header{text-align:left;margin-bottom:20px;display:none}.print-header h1{font-size:20px;margin:5px 0}.print-header p{margin:4px 0;font-size:14px}.mobile-tabs{display:none}@media(max-width:768px){body{padding:10px}.container{flex-direction:column;gap:10px}.panel{width:100%;padding:15px 15px 70px 15px;display:none}.panel.active{display:flex}.mobile-tabs{display:flex;gap:10px;margin-bottom:10px;width:100%}.mobile-tabs button{flex:1;padding:12px;font-size:16px;border-radius:6px;background:#e0e0e0;color:#333}.mobile-tabs button.active{background:#007bff;color:#fff}.btn-left,.btn-right{padding:10px;font-size:14px}input[type=text],input[type=number]{font-size:16px;padding:12px}.actions{position:sticky;bottom:0;background:#fff;padding-top:10px;padding-bottom:env(safe-area-inset-bottom,10px);z-index:10}}@media print{@page{size:A4;margin:5mm}body{background:#fff;margin:0;padding:0;height:auto;overflow:visible}.container{display:block;height:auto}.panel{width:100%!important;box-shadow:none;padding:0;overflow:visible;height:auto;display:block!important}.panel:first-child{display:none!important}.mobile-tabs{display:none!important}#header-inputs,.actions,.btn-del,.clear-toggle{display:none}.print-header{display:block!important;margin-bottom:10px}.print-header h1{font-size:18px}.print-header p{font-size:13px}.print-layout{display:flex;gap:10px}.print-col{width:50%}table{font-size:10px;margin-top:5px;table-layout:fixed;border-collapse:collapse}th,td{padding:0 2px;border:1px solid #000;line-height:1.1}th{font-size:11px;text-align:center;padding:1px 2px}.print-col h3{font-size:15px;margin:3px 0}#table-paint th:nth-child(1),#table-materials th:nth-child(1){width:65px}#table-paint th:nth-child(2),#table-materials th:nth-child(2){width:auto}#table-paint th:nth-child(3),#table-materials th:nth-child(3){width:35px;text-align:center}.action-col,td:last-child,th:last-child{display:none!important}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield;border:none;background:transparent;width:100%;text-align:center;font-size:10px;font-weight:bold;padding:0}}</style></head><body><div id="error-log" style="display:none;background:red;color:#fff;padding:15px;margin-bottom:15px;border-radius:6px;font-weight:bold;position:fixed;top:10px;left:10px;right:10px;z-index:9999"></div><div class="mobile-tabs"><button id="tabSearch" class="active" onclick="switchTab('search')">🔍 Поиск</button><button id="tabForm" onclick="switchTab('form')">📋 Бланк</button></div><div class="container"><div class="panel active" id="panelSearch"><h2>1. Поиск</h2><label class="clear-toggle"><input type="checkbox" id="clearSearchToggle" checked>Очищать поиск при добавлении</label><input type="text" id="search" placeholder="Введите код, название или бренд..." oninput="searchItems()"><div class="manual-add"><h4>➕ Вручную</h4><div class="manual-inputs"><input type="text" id="manualCode" placeholder="Код" style="width:35%"><input type="text" id="manualName" placeholder="Наименование" style="width:65%"></div><div class="manual-btns"><button class="btn-left" onclick="addManual('paint')">◀ В Эмаль</button><button class="btn-right" onclick="addManual('materials')">В Материалы ▶</button></div></div><ul id="results"></ul></div><div class="panel" id="panelForm"><div id="header-inputs"><h2>2. Данные</h2><input type="text" id="orderNum" placeholder="№ Заказ-наряда" style="margin-bottom:5px"><input type="text" id="carModel" placeholder="Автомобиль" style="margin-bottom:5px"><input type="text" id="vin" placeholder="VIN / Номер" style="margin-bottom:5px"><input type="text" id="master" placeholder="Маляр" style="margin-bottom:5px" value=""></div><div class="print-header" id="document-header"><h1>Малярный цех</h1><p id="print-order"></p><p id="print-car"></p><p id="print-master"></p><p id="print-date" style="color:#555;font-size:12px;margin-top:10px"></p></div><div class="print-layout"><div class="print-col"><h3 style="text-align:center">Автоэмаль</h3><table id="table-paint"><thead><tr><th>Код</th><th>Наименование</th><th>Кол-во</th><th class="action-col">Удалить</th></tr></thead><tbody></tbody></table></div><div class="print-col"><h3 style="text-align:center">Материалы</h3><table id="table-materials"><thead><tr><th>Код</th><th>Наименование</th><th>Кол-во</th><th class="action-col">Удалить</th></tr></thead><tbody></tbody></table></div></div><div class="actions"><button class="btn-pdf" onclick="preparePrint()">📄 PDF</button><button class="btn-clear" onclick="clearAll()">🗑️ Очистить</button></div><div class="hint">В окне печати выберите <b>«Сохранить как PDF»</b></div></div></div><script src="database.js"></script><script>window.onerror=function(m,u,l){var e=document.getElementById('error-log');e.style.display='block';e.innerHTML='ОШИБКА: '+m+'<br>Строка: '+l;return false};function switchTab(t){document.getElementById('panelSearch').classList.remove('active');document.getElementById('panelForm').classList.remove('active');document.getElementById('tabSearch').classList.remove('active');document.getElementById('tabForm').classList.remove('active');if(t==='search'){document.getElementById('panelSearch').classList.add('active');document.getElementById('tabSearch').classList.add('active')}else{document.getElementById('panelForm').classList.add('active');document.getElementById('tabForm').classList.add('active')}}function saveState(){const s={orderNum:document.getElementById('orderNum').value,carModel:document.getElementById('carModel').value,vin:document.getElementById('vin').value,master:document.getElementById('master').value,paintRows:[],materialRows:[]};document.querySelectorAll('#table-paint tbody tr').forEach(t=>{s.paintRows.push({code:t.cells[0].innerText,name:t.cells[1].innerText,fullName:t.cells[1].getAttribute('title'),qty:t.querySelector('input').value})});document.querySelectorAll('#table-materials tbody tr').forEach(t=>{s.materialRows.push({code:t.cells[0].innerText,name:t.cells[1].innerText,fullName:t.cells[1].getAttribute('title'),qty:t.querySelector('input').value})});localStorage.setItem('paintShopFormData',JSON.stringify(s))}function loadState(){const s=localStorage.getItem('paintShopFormData');if(!s)return;try{const st=JSON.parse(s);document.getElementById('orderNum').value=st.orderNum||'';document.getElementById('carModel').value=st.carModel||'';document.getElementById('vin').value=st.vin||'';document.getElementById('master').value=st.master||'';const pt=document.querySelector('#table-paint tbody');pt.innerHTML='';st.paintRows.forEach(r=>{addRowToTable(pt,r.code,r.name,r.fullName,r.qty)});const mt=document.querySelector('#table-materials tbody');mt.innerHTML='';st.materialRows.forEach(r=>{addRowToTable(mt,r.code,r.name,r.fullName,r.qty)})}catch(e){console.error(e)}}function clearAll(){if(confirm("Начать новый наряд? Данные сотрутся.")){document.getElementById('orderNum').value='';document.getElementById('carModel').value='';document.getElementById('vin').value='';document.getElementById('master').value='';document.querySelector('#table-paint tbody').innerHTML='';document.querySelector('#table-materials tbody').innerHTML='';localStorage.removeItem('paintShopFormData')}}function addRowToTable(t,c,s,f,q=1){const tr=document.createElement('tr');tr.innerHTML=`<td style="font-size:13px">${c}</td><td style="font-size:13px" title="${f}">${s}</td><td><input type="number" step="0.01" value="${q}" style="width:100%;box-sizing:border-box;padding:4px" oninput="saveState()"></td><td class="action-col" style="text-align:center"><button class="btn-del" onclick="this.closest('tr').remove();saveState()">X</button></td>`;t.appendChild(tr)}const translitMap={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"," ":" "};function translit(str){return str.split('').map(c=>translitMap[c]||c).join('')}function searchItems(){const input=document.getElementById('search').value.toLowerCase().trim();const r=document.getElementById('results');r.innerHTML='';if(input.length<2)return;const words=input.split(/\s+/);const f=database.filter(i=>{const text=(i.code+' '+i.name).toLowerCase();const textTranslit=translit(text);return words.every(w=>text.includes(w)||textTranslit.includes(w)||text.includes(translit(w)))});f.slice(0,30).forEach(i=>{const li=document.createElement('li');li.innerHTML=`<div style="flex:1;padding-right:10px"><strong>${i.name}</strong><br><span class="code">${i.code}</span></div><div class="btn-group"><button class="btn-left" onclick="addToReport('${i.code}','${i.name.replace(/'/g,"&#39;").replace(/"/g,'&quot;')}','paint')">◀ Эмаль</button><button class="btn-right" onclick="addToReport('${i.code}','${i.name.replace(/'/g,"&#39;").replace(/"/g,'&quot;')}','materials')">Матер ▶</button></div>`;r.appendChild(li)})}function addToReport(c,n,t){const ti=t==='paint'?'#table-paint tbody':'#table-materials tbody';const tb=document.querySelector(ti);let sn=n.replace(/^Краска\s+(Brulex|Normex)\s+MIX\s+/i,'$1 ').replace(/^Краска\s+/i,'');addRowToTable(tb,c,sn,n,1);const sc=document.getElementById('clearSearchToggle').checked;if(sc){document.getElementById('search').value='';document.getElementById('results').innerHTML='';if(window.innerWidth<=768)switchTab('form')}saveState()}function addManual(t){const c=document.getElementById('manualCode');const n=document.getElementById('manualName');let code=c.value.trim()||"—";let name=n.value.trim();if(!name)return alert("Введите наименование!");addToReport(code,name,t);c.value='';n.value=''}function preparePrint(){const o=document.getElementById('orderNum').value||"";const c=document.getElementById('carModel').value||"";const v=document.getElementById('vin').value||"";const m=document.getElementById('master').value||"";if(!m.trim()){alert("Пожалуйста, введите имя маляра перед формированием PDF.");document.getElementById('master').focus();return}document.getElementById('print-order').innerHTML=o?`<strong>Заказ-наряд №</strong> ${o}`:'';let cs=`<strong>Автомобиль:</strong> ${c}`;if(v)cs+=` | <strong>VIN/Номер:</strong> ${v}`;document.getElementById('print-car').innerHTML=(c||v)?cs:'';document.getElementById('print-master').innerHTML=`<strong>Маляр:</strong> ${m}`;document.getElementById('print-date').innerHTML=`Дата: ${new Date().toLocaleDateString('ru-RU')}`;window.print()}document.querySelectorAll('#header-inputs input').forEach(i=>{i.addEventListener('input',saveState)});window.onload=loadState;</script></body></html>
